    <body>
        <div class="card" style="width: 100%">
            
            
            <div id="mynetwork" class="card-body"></div>
        </div>

        
        

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#0000FF", "id": "a", "label": "a", "labels": "a", "layer": 3, "shape": "dot", "size": 10, "x": 127.0, "y": 382}, {"color": "#0000FF", "id": "o", "label": "o", "labels": "o", "layer": 4, "shape": "dot", "size": 10, "x": 99.0, "y": 476}, {"color": "#0000FF", "id": "t", "label": "t", "labels": "t", "layer": 2, "shape": "dot", "size": 10, "x": 6.0, "y": 283}, {"color": "#0000FF", "id": "v", "label": "v", "labels": "v", "layer": 1, "shape": "dot", "size": 10, "x": 110.0, "y": 212}, {"color": "#0000FF", "id": "p", "label": "p", "labels": "p", "layer": 2, "shape": "dot", "size": 10, "x": 116.0, "y": 308}, {"color": "#0000FF", "id": "q", "label": "q", "labels": "q", "layer": 2, "shape": "dot", "size": 10, "x": 238.0, "y": 305}, {"color": "#FFFF00", "id": "x", "label": "x", "labels": "x", "layer": 0, "shape": "dot", "size": 10, "x": 45.0, "y": 107}, {"color": "#FFFF00", "id": "y", "label": "y", "labels": "y", "layer": 0, "shape": "dot", "size": 10, "x": 152.0, "y": 101}]);
                  edges = new vis.DataSet([{"arrows": "to", "color": "#008000", "from": "a", "to": "o", "type": "arrow", "width": 1}, {"arrows": "to", "color": "#008000", "from": "t", "to": "o", "type": "arrow", "width": 1}, {"arrows": "to", "color": "#FF0000", "from": "v", "to": "t", "width": 1}, {"arrows": "to", "color": "#008000", "from": "v", "to": "p", "width": 1}, {"arrows": "to", "color": "#FF0000", "from": "v", "to": "q", "width": 1}, {"arrows": "to", "color": "#008000", "from": "p", "to": "a", "type": "arrow", "width": 1}, {"arrows": "to", "color": "#008000", "from": "q", "to": "a", "type": "arrow", "width": 1}, {"arrows": "to", "color": "#008000", "from": "x", "to": "v", "type": "arrow", "width": 1}, {"arrows": "to", "color": "#008000", "from": "y", "to": "v", "type": "arrow", "width": 1}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": false,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>
