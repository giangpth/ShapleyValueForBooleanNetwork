        <script type="text/javascript">

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#0000FF", "id": "G", "label": "G", "labels": "G", "layer": 2, "shape": "dot", "size": 15, "x": [55.0, 200], "y": 474}, {"color": "#0000FF", "id": "I", "label": "I", "labels": "I", "layer": 3, "shape": "dot", "size": 15, "x": [110.0, 300], "y": 580}, {"color": "#0000FF", "id": "F", "label": "F", "labels": "F", "layer": 1, "shape": "dot", "size": 15, "x": [0.0, 100], "y": 298}, {"color": "#0000FF", "id": "H", "label": "H", "labels": "H", "layer": 2, "shape": "dot", "size": 15, "x": [165.0, 200], "y": 456}, {"color": "#0000FF", "id": "E", "label": "E", "labels": "E", "layer": 1, "shape": "dot", "size": 15, "x": [110.0, 100], "y": 323}, {"color": "#FFFF00", "id": "B", "label": "B", "labels": "B", "layer": 0, "shape": "dot", "size": 15, "x": [0.0, 0], "y": 163}, {"color": "#0000FF", "id": "D", "label": "D", "labels": "D", "layer": 1, "shape": "dot", "size": 15, "x": [220.0, 100], "y": 292}, {"color": "#FFFF00", "id": "C", "label": "C", "labels": "C", "layer": 0, "shape": "dot", "size": 15, "x": [110.0, 0], "y": 163}, {"color": "#FFFF00", "id": "A", "label": "A", "labels": "A", "layer": 0, "shape": "dot", "size": 15, "x": [220.0, 0], "y": 160}]);
                  edges = new vis.DataSet([{"arrows": "to", "color": "#808080", "from": "G", "to": "I", "width": 1}, {"arrows": "to", "color": "#808080", "from": "F", "to": "H", "width": 1}, {"arrows": "to", "color": "#808080", "from": "E", "to": "G", "width": 1}, {"arrows": "to", "color": "008000", "from": "B", "to": "D", "width": 1}, {"arrows": "to", "color": "#808080", "from": "B", "to": "E", "width": 1}, {"arrows": "to", "color": "#808080", "from": "D", "to": "G", "width": 1}, {"arrows": "to", "color": "#FF0000", "from": "C", "to": "F", "width": 1}, {"arrows": "to", "color": "#808080", "from": "H", "to": "I", "width": 1}, {"arrows": "to", "color": "008000", "from": "A", "to": "D", "width": 1}]);

                  nodeColors = {};

                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;

                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph

                  var options = {
    "configure": {

    }
};

                  return network;

              }
